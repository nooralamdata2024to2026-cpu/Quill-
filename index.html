<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quill</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@600;700&family=Kalam:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper: #ECE4D3;
    --paper-soft: #F3ECDD;
    --ink: #1C2A44;
    --ink-soft: #33456b;
    --line: #b8a888;
    --wax: #7a2e2e;
    --error: #8c2f2f;
    --bubble-in: #F6F0E2;
    --unread: #1C2A44;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; background:#0d1420; color:var(--ink); overflow:hidden; }

  /* ============================================================
     AUTH SCREEN (Login / Signup)
  ============================================================ */
  #authWrapper{
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 20% 15%, rgba(0,0,0,0.03), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.04), transparent 45%),
      var(--paper);
    font-family:'Cormorant Garamond', serif;
  }
  .card{
    position:relative; width:100%; max-width:380px;
    background: var(--paper); border:1px solid var(--line); border-radius:4px;
    padding:40px 32px 32px; box-shadow: 0 2px 0 rgba(0,0,0,0.05), 0 12px 30px rgba(28,42,68,0.12);
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:8px; border:1px solid rgba(28,42,68,0.15); border-radius:2px; pointer-events:none;
  }
  .brand{ text-align:center; margin-bottom:4px; }
  .brand h1{ font-family:'Dancing Script', cursive; font-size:2.6rem; margin:0; }
  .brand p{ margin:2px 0 0; font-size:0.95rem; letter-spacing:2px; color: var(--ink-soft); font-style:italic; }
  .feather-icon{ display:block; margin:12px auto 18px; width:42px; height:42px; opacity:0.75; }
  .tabs{ display:flex; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .tab{
    flex:1; text-align:center; padding:8px 0 12px; font-family:'Playfair Display', serif; font-size:1.02rem;
    color: var(--ink-soft); cursor:pointer; position:relative; background:none; border:none; font-weight:500;
  }
  .tab.active{ color: var(--ink); }
  .tab.active::after{ content:""; position:absolute; bottom:-1px; left:30%; right:30%; height:2px; background: var(--wax); }
  .step{ display:none; flex-direction:column; gap:15px; }
  .step.active{ display:flex; }
  .step-title{ font-family:'Playfair Display', serif; font-size:1.1rem; text-align:center; margin:0 0 2px; }
  .field label{ display:block; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase; color: var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input{
    width:100%; padding:9px 4px; font-size:1.08rem; font-family:'Cormorant Garamond', serif;
    background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--ink);
    outline:none; transition:border-color 0.2s; letter-spacing:0.5px;
  }
  .field input:focus{ border-bottom:1.5px solid var(--ink); }
  .field input.invalid{ border-bottom:1.5px solid var(--error); }
  .err-msg{ font-size:0.78rem; color:var(--error); margin-top:3px; min-height:1em; font-style:italic; }
  .submit-btn{
    margin-top:4px; padding:12px; background:var(--ink); color:var(--paper); border:none; border-radius:2px;
    font-family:'Playfair Display', serif; font-size:1rem; letter-spacing:1px; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:0.55; }
  .success-toast{
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-20px);
    background: var(--ink); color: var(--paper); padding:12px 22px; border-radius:3px;
    font-family:'Playfair Display', serif; font-size:0.9rem;
    opacity:0; transition:all 0.35s ease; pointer-events:none; z-index:10;
  }
  .success-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .debug-banner{
    display:none; position:fixed; top:0; left:0; right:0; background:#8c2f2f; color:#fff;
    font-family: monospace; font-size:0.75rem; padding:10px 14px; z-index:999; word-break:break-word; line-height:1.4;
  }

  /* ============================================================
     APP SCREEN (Chats)
  ============================================================ */
  #appWrapper{ display:none; height:100%; font-family:'Kalam', cursive; }
  .app{
    max-width:460px; margin:0 auto; height:100vh; height:100dvh;
    display:flex; flex-direction:column; background: var(--paper); position:relative;
    border:9px solid #10182a; border-radius:22px; overflow:hidden;
  }
  .screen{ position:absolute; inset:9px; display:flex; flex-direction:column; background:var(--paper); transition: transform 0.28s ease; }
  #listScreen{ z-index:1; }
  #chatScreen, #contactsScreen{ z-index:2; transform: translateX(100%); }
  #chatScreen.open, #contactsScreen.open{ transform: translateX(0); }
  .list-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 2px; }
  .brand-row{ display:flex; align-items:center; gap:6px; }
  .brand-row .brand2{ font-family:'Caveat', cursive; font-weight:700; font-size:2.1rem; color:var(--ink); }
  .icon-btn{ background:none; border:none; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; width:32px; height:32px; opacity:0.85; }
  .icon-btn svg{ width:19px; height:19px; }
  .tagline2{ padding:0 18px 6px; font-size:0.95rem; color:var(--ink-soft); font-style:italic; }
  .welcome-line{ padding:0 18px 6px; font-size:0.9rem; color:var(--wax); font-style:italic; }
  .tabs-row{ display:flex; gap:0; padding:6px 14px 0; border-bottom:1px solid var(--line); }
  .tab-item{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px; font-family:'Kalam', cursive;
    font-weight:700; font-size:0.96rem; color: var(--ink-soft); padding-bottom:10px; position:relative; cursor:pointer;
  }
  .tab-item svg{ width:16px; height:16px; }
  .tab-item.active{ color:var(--ink); }
  .tab-item.active::after{ content:""; position:absolute; left:15%; right:15%; bottom:-1px; height:2px; background:var(--wax); }
  .chat-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; }
  .empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px; text-align:center; }
  .empty-state svg{ width:56px; height:56px; color:var(--ink-soft); opacity:0.5; }
  .empty-state .et{ font-family:'Kalam', cursive; font-weight:700; font-size:1.15rem; color:var(--ink); }
  .empty-state .es{ font-size:0.95rem; color:var(--ink-soft); max-width:260px; }
  .seal-mark{
    position:absolute; bottom:14px; right:16px; width:56px; height:56px; border-radius:50%;
    background: var(--ink); border:3px solid var(--paper); box-shadow:0 0 0 1.5px var(--line), 0 4px 12px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
  }
  .seal-mark svg{ width:24px; height:24px; color:var(--paper-soft); }
  .chat-row{ display:flex; align-items:center; gap:13px; padding:12px 18px; border-bottom:1px solid rgba(184,168,136,0.3); cursor:pointer; background:var(--paper); }
  .chat-row:active{ background: var(--paper-soft); }
  .avatar{
    width:50px; height:50px; border-radius:50%; background: var(--paper-soft); color:var(--ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1.3px solid var(--line);
    overflow:hidden; padding:11px;
  }
  .avatar svg{ width:100%; height:100%; }
  .avatar.dark{ background: var(--ink); color: var(--paper-soft); border-color:var(--wax); }
  .chat-info{ flex:1; min-width:0; }
  .chat-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .chat-name{ font-family:'Kalam', cursive; font-weight:700; font-size:1.06rem; }
  .chat-time{ font-size:0.8rem; color:var(--ink-soft); flex-shrink:0; }
  .chat-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
  .chat-preview{ font-size:0.95rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
  .sub-header{ display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); }
  .sub-header-title{ font-family:'Kalam', cursive; font-weight:700; font-size:1.1rem; }
  .chat-header .avatar{ width:38px; height:38px; padding:8px; }
  .chat-header-info{ flex:1; }
  .chat-header-name{ font-family:'Kalam', cursive; font-weight:700; font-size:1.05rem; }
  .chat-header-status{ font-size:0.83rem; color:var(--ink-soft); }
  .messages{
    flex:1; overflow-y:auto; padding:16px 14px 10px; display:flex; flex-direction:column; gap:12px; position:relative;
    background: radial-gradient(circle at 15% 10%, rgba(0,0,0,0.02), transparent 40%), radial-gradient(circle at 90% 85%, rgba(0,0,0,0.03), transparent 45%), var(--paper);
  }
  .bubble-row{ display:flex; }
  .bubble-row.out{ justify-content:flex-end; }
  .bubble{ max-width:75%; padding:9px 13px; border-radius:2px; font-size:1.03rem; line-height:1.35; position:relative; }
  .bubble::before, .bubble::after{ content:"✕"; position:absolute; font-size:0.5rem; opacity:0.5; font-family: sans-serif; }
  .bubble.in::before, .bubble.in::after{ color: var(--ink-soft); }
  .bubble.out::before, .bubble.out::after{ color: var(--paper); opacity:0.4; }
  .bubble::before{ top:-5px; left:-5px; }
  .bubble::after{ bottom:-5px; right:-5px; }
  .bubble.in{ background: var(--bubble-in); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:0; }
  .bubble.out{ background: var(--ink); color: var(--paper); border-bottom-right-radius:0; }
  .bubble-time{ display:block; font-size:0.7rem; margin-top:4px; text-align:right; opacity:0.75; }
  .composer{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background: var(--paper); }
  .composer input{ flex:1; padding:9px 14px; border-radius:20px; border:1px solid var(--line); background: var(--paper-soft); font-family:'Kalam', cursive; font-size:1rem; color: var(--ink); outline:none; }
  .send-btn{ width:38px; height:38px; border-radius:50%; background: var(--ink); color:var(--paper); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .send-btn svg{ width:16px; height:16px; }
</style>
</head>
<body>

<div class="debug-banner" id="debugBanner"></div>

<!-- ============================================================
     AUTH SCREEN
============================================================ -->
<div id="authWrapper">
  <div class="card">
    <div class="brand">
      <h1>Quill</h1>
      <p>write. share. connect.</p>
    </div>
    <svg class="feather-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 52C28 40 40 28 52 10C48 30 40 42 12 52Z" stroke="#1C2A44" stroke-width="1.4" fill="none"/>
      <path d="M12 52C22 46 30 38 38 26" stroke="#1C2A44" stroke-width="1"/>
      <circle cx="12" cy="52" r="1.6" fill="#1C2A44"/>
    </svg>

    <div class="tabs">
      <button class="tab active" id="tabSignup">Sign Up</button>
      <button class="tab" id="tabLogin">Login</button>
    </div>

    <div class="step active" id="stepSignup">
      <div class="field">
        <label for="suName">Naam</label>
        <input type="text" id="suName" placeholder="e.g. Noor Alam">
        <div class="err-msg" id="suNameErr"></div>
      </div>
      <div class="field">
        <label for="suPhone">Phone Number</label>
        <input type="tel" id="suPhone" placeholder="e.g. 98765 43210" maxlength="10">
        <div class="err-msg" id="suPhoneErr"></div>
      </div>
      <div class="field">
        <label for="suPass">Password</label>
        <input type="password" id="suPass" placeholder="Kam se kam 6 characters">
        <div class="err-msg" id="suPassErr"></div>
      </div>
      <div class="field">
        <label for="suConfirm">Password Confirm Karein</label>
        <input type="password" id="suConfirm" placeholder="••••••••">
        <div class="err-msg" id="suConfirmErr"></div>
      </div>
      <button class="submit-btn" id="signupBtn">Quill join karein</button>
    </div>

    <div class="step" id="stepLogin">
      <div class="step-title">Wapas Quill par aayein</div>
      <div class="field">
        <label for="liPhone">Phone Number</label>
        <input type="tel" id="liPhone" placeholder="e.g. 98765 43210" maxlength="10">
        <div class="err-msg" id="liPhoneErr"></div>
      </div>
      <div class="field">
        <label for="liPass">Password</label>
        <input type="password" id="liPass" placeholder="••••••••">
        <div class="err-msg" id="liPassErr"></div>
      </div>
      <button class="submit-btn" id="loginBtn">Login Karein</button>
    </div>
  </div>
</div>

<div class="success-toast" id="toast"></div>

<!-- ============================================================
     APP SCREEN (Chats)
============================================================ -->
<div id="appWrapper">
  <div class="app">

    <div class="screen" id="listScreen">
      <div class="list-header">
        <div class="brand-row">
          <div class="brand2">Quill</div>
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" style="width:24px;height:24px;transform:rotate(15deg);"><path d="M34 8C24 14 14 24 10 38c10-4 22-12 28-22 2-3 2-6-1-8-2-1-2-1-3 0Z"/><path d="M10 38c6-4 12-10 17-17"/></svg>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
      <div class="tagline2">write. share. connect.</div>
      <div class="welcome-line" id="welcomeLine" style="display:none;"></div>

      <div class="tabs-row">
        <div class="tab-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.4 8.5 8.5 0 0 1-4.1-1L3 20l1.1-5.4A8.4 8.4 0 1 1 21 11.5Z"/></svg>
          Chats
        </div>
        <div class="tab-item" id="statusTab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 .5 17 .5s2.5 6.5-2 12c-1.5 1.5-2.5 3.5-2.5 6"/></svg>
          Status
        </div>
        <div class="tab-item" id="quillTab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9v6H6z"/><path d="M10.5 8v12l-2 2-2-2V8"/></svg>
          Quill
        </div>
      </div>

      <div class="chat-list" id="chatList"></div>
      <div class="seal-mark" id="sealMark" title="Naya chat shuru karein">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M34 8C24 14 14 24 10 38c10-4 22-12 28-22 2-3 2-6-1-8-2-1-2-1-3 0Z"/><path d="M10 38c6-4 12-10 17-17"/></svg>
      </div>
    </div>

    <div class="screen" id="contactsScreen">
      <div class="sub-header">
        <button class="icon-btn" id="contactsBackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="sub-header-title">Registered Phone Numbers</div>
      </div>
      <div class="chat-list" id="contactsList"></div>
    </div>

    <div class="screen" id="chatScreen">
      <div class="chat-header sub-header">
        <button class="icon-btn" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="avatar" id="chatAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatName"></div>
          <div class="chat-header-status" id="chatStatus"></div>
        </div>
      </div>
      <div class="messages" id="messages">
        <svg class="feather-deco" viewBox="0 0 80 100" fill="none" stroke="currentColor" stroke-width="1.2" style="position:absolute; right:6px; bottom:80px; width:80px; height:100px; opacity:0.3; color:var(--ink); pointer-events:none; z-index:1;">
          <path d="M55 12C40 25 25 45 15 85c15-7 35-20 45-40 4-8 4-15-1-20-3-3-3-3-4-1Z"/>
          <path d="M15 85c8-6 16-14 22-24"/>
          <path d="M60 18c5 2 10 3 14 1M66 10c4 2 7 2 10 0M52 26c4 3 9 3 12 1"/>
        </svg>
      </div>
      <div class="composer">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  function showDebug(msg){
    const b = document.getElementById('debugBanner');
    if(!b) return;
    b.textContent = '⚠️ ' + msg;
    b.style.display = 'block';
  }
  window.addEventListener('error', function(e){ showDebug('Error: ' + e.message + ' (line ' + e.lineno + ')'); });

  const firebaseConfig = {
    apiKey: "AIzaSyB2pqAfH1hPW8M5GXeZpjVkknm72G--fr8",
    authDomain: "quill-34ba9.firebaseapp.com",
    projectId: "quill-34ba9",
    storageBucket: "quill-34ba9.firebasestorage.app",
    messagingSenderId: "946011366725",
    appId: "1:946011366725:web:0b17d601de7d4dcfa08a2c"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener('DOMContentLoaded', function(){

    // ============================================================
    // AUTH LOGIC
    // ============================================================
    const tabSignup = document.getElementById('tabSignup');
    const tabLogin = document.getElementById('tabLogin');
    const stepSignup = document.getElementById('stepSignup');
    const stepLogin = document.getElementById('stepLogin');

    function goStep(el){ [stepSignup, stepLogin].forEach(s => s.classList.remove('active')); el.classList.add('active'); }
    tabSignup.addEventListener('click', () => { tabSignup.classList.add('active'); tabLogin.classList.remove('active'); goStep(stepSignup); });
    tabLogin.addEventListener('click', () => { tabLogin.classList.add('active'); tabSignup.classList.remove('active'); goStep(stepLogin); });

    function setError(input, errEl, msg){
      if(msg){ input.classList.add('invalid'); errEl.textContent = msg; return false; }
      input.classList.remove('invalid'); errEl.textContent = ''; return true;
    }
    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(()=> t.classList.remove('show'), 2200);
    }
    function generateFakeId(name){
      const clean = name.trim().split(/\s+/)[0].toLowerCase();
      return '@' + clean + Math.floor(1000 + Math.random()*9000);
    }

    const signupBtn = document.getElementById('signupBtn');
    signupBtn.addEventListener('click', async function(){
      const nameInput = document.getElementById('suName');
      const phoneInput = document.getElementById('suPhone');
      const passInput = document.getElementById('suPass');
      const confirmInput = document.getElementById('suConfirm');
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim().replace(/\s+/g, '');
      const pass = passInput.value;
      const confirm = confirmInput.value;

      let ok = true;
      ok = setError(nameInput, document.getElementById('suNameErr'), name.length < 2 ? 'Apna naam likhein' : '') && ok;
      ok = setError(phoneInput, document.getElementById('suPhoneErr'), !/^[6-9]\d{9}$/.test(phone) ? '10 anko ka sahi phone number likhein' : '') && ok;
      ok = setError(passInput, document.getElementById('suPassErr'), pass.length < 6 ? 'Password kam se kam 6 characters ka ho' : '') && ok;
      ok = setError(confirmInput, document.getElementById('suConfirmErr'), confirm !== pass ? 'Password match nahi kar raha' : '') && ok;
      if(!ok) return;

      signupBtn.disabled = true; signupBtn.textContent = 'Bana rahe hain...';
      try{
        const docRef = db.collection('users').doc(phone);
        const existing = await docRef.get();
        if(existing.exists){
          setError(phoneInput, document.getElementById('suPhoneErr'), 'Ye number pehle se register hai, Login karein');
          tabLogin.click();
          return;
        }
        const userId = generateFakeId(name);
        await docRef.set({ name, phone, password: pass, userId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        toast('Khush aamdeed Quill par, ' + name + '!');
        enterApp(name, phone, userId);
      } catch(err){
        setError(phoneInput, document.getElementById('suPhoneErr'), 'Kuch gadbad hui: ' + err.message);
      } finally {
        signupBtn.disabled = false; signupBtn.textContent = 'Quill join karein';
      }
    });

    const loginBtn = document.getElementById('loginBtn');
    loginBtn.addEventListener('click', async function(){
      const phoneInput = document.getElementById('liPhone');
      const passInput = document.getElementById('liPass');
      const phone = phoneInput.value.trim().replace(/\s+/g, '');
      const pass = passInput.value;

      let ok = true;
      ok = setError(phoneInput, document.getElementById('liPhoneErr'), !/^[6-9]\d{9}$/.test(phone) ? '10 anko ka sahi phone number likhein' : '') && ok;
      ok = setError(passInput, document.getElementById('liPassErr'), pass === '' ? 'Password daalein' : '') && ok;
      if(!ok) return;

      loginBtn.disabled = true; loginBtn.textContent = 'Check kar rahe hain...';
      try{
        const docRef = db.collection('users').doc(phone);
        const snap = await docRef.get();
        if(!snap.exists){
          setError(phoneInput, document.getElementById('liPhoneErr'), 'Ye number register nahi hai, pehle Sign Up karein');
          return;
        }
        const data = snap.data();
        if(data.password !== pass){
          setError(passInput, document.getElementById('liPassErr'), 'Galat password');
          return;
        }
        toast('Wapas aane ka shukriya, ' + data.name + '!');
        enterApp(data.name, data.phone, data.userId);
      } catch(err){
        setError(phoneInput, document.getElementById('liPhoneErr'), 'Kuch gadbad hui: ' + err.message);
      } finally {
        loginBtn.disabled = false; loginBtn.textContent = 'Login Karein';
      }
    });

    // ============================================================
    // AUTH -> APP switch (koi redirect nahi, sirf screen badalte hain)
    // ============================================================
    let me = { name:'', phone:'', userId:'' };

    function enterApp(name, phone, userId){
      me = { name, phone, userId };
      setTimeout(() => {
        document.getElementById('authWrapper').style.display = 'none';
        document.getElementById('appWrapper').style.display = 'block';
        const wl = document.getElementById('welcomeLine');
        wl.textContent = 'Logged in as ' + me.name + (me.userId ? ' (' + me.userId + ')' : '');
        wl.style.display = 'block';
        initApp();
      }, 600);
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('appWrapper').style.display = 'none';
      document.getElementById('authWrapper').style.display = 'flex';
      me = { name:'', phone:'', userId:'' };
    });

    // ============================================================
    // APP LOGIC (Chats)
    // ============================================================
    let appInitialized = false;
    function initApp(){
      if(appInitialized) return;
      appInitialized = true;

      const chatListEl = document.getElementById('chatList');
      const contactsListEl = document.getElementById('contactsList');
      const contactsScreen = document.getElementById('contactsScreen');
      const chatScreen = document.getElementById('chatScreen');
      const messagesEl = document.getElementById('messages');
      const featherDecoHTML = messagesEl.innerHTML;

      let liveChats = [];
      let activeChatId = null;
      let activeMsgUnsub = null;
      let selfNotes = [];

      function initialsOf(name){ return (name || '?').trim()[0].toUpperCase(); }
      function chatIdFor(a, b){ return [a, b].sort().join('_'); }

      // ============================================================
      // ILLUSTRATED ICONS — reference mockup jaisa look
      // ============================================================
      const iconSet = {
        feather: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M34 8C24 14 14 24 10 38c10-4 22-12 28-22 2-3 2-6-1-8-2-1-2-1-3 0Z"/><path d="M10 38c6-4 12-10 17-17"/></svg>`,
        mountain: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 34 18 16l8 10 6-7 10 15Z"/><circle cx="32" cy="14" r="3"/></svg>`,
        lantern: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="16" y="14" width="16" height="20" rx="3"/><path d="M20 14v-4h8v4M20 34v4h8v-4M24 4v4M24 40v4"/></svg>`,
        book: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M24 12c-4-3-10-3-14-1v24c4-2 10-2 14 1 4-3 10-3 14-1V11c-4-2-10-2-14 1Z"/><path d="M24 12v24"/></svg>`,
        coffee: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 20h22v9a11 11 0 0 1-11 11 11 11 0 0 1-11-11Z"/><path d="M32 22h3a5 5 0 0 1 0 10h-3"/><path d="M14 34h16"/><ellipse cx="21" cy="38" rx="12" ry="2"/></svg>`,
        people: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="17" cy="18" r="5"/><circle cx="31" cy="18" r="5"/><path d="M8 36c1-6 5-9 9-9s8 3 9 9M22 36c1-6 5-9 9-9s8 3 9 9"/></svg>`,
        plant: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M24 40V20"/><path d="M24 22c0-8 8-12 12-12 0 8-4 14-12 12Z"/><path d="M24 26c0-6-6-9-10-9 0 6 3 11 10 9Z"/></svg>`,
        moon: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M30 8a16 16 0 1 0 10 26 12 12 0 0 1-10-26Z"/><path d="M36 10l1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" fill="currentColor" stroke="none"/></svg>`
      };
      const iconKeys = Object.keys(iconSet);
      function iconForPhone(phone){
        if(!phone) return iconSet.feather;
        let hash = 0;
        for(let i=0;i<phone.length;i++) hash = (hash + phone.charCodeAt(i)) % iconKeys.length;
        return iconSet[iconKeys[hash]];
      }

      function renderChatList(){
        chatListEl.innerHTML = '';
        const items = [{ id:'self', name: me.name + ' (You)', dark:true, time:'now', preview:'Khud ko note likhein', isSelf:true }];
        liveChats.forEach(c => items.push(c));

        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'chat-row';
          row.innerHTML = `
            <div class="avatar ${item.dark ? 'dark' : ''}">${item.isSelf ? iconSet.feather : iconForPhone(item.id)}</div>
            <div class="chat-info">
              <div class="chat-top"><div class="chat-name">${item.name}</div><div class="chat-time">${item.time || ''}</div></div>
              <div class="chat-bottom"><div class="chat-preview">${item.preview || ''}</div></div>
            </div>`;
          row.addEventListener('click', () => { item.isSelf ? openSelfChat() : openRealChat(item.id, item.name); });
          chatListEl.appendChild(row);
        });
      }

      db.collection('chats').where('participants', 'array-contains', me.phone).onSnapshot(function(snap){
        liveChats = [];
        snap.forEach(doc => {
          const d = doc.data();
          const otherPhone = d.participants.find(p => p !== me.phone) || me.phone;
          const otherName = (d.participantNames && d.participantNames[otherPhone]) || otherPhone;
          liveChats.push({ id: doc.id, name: otherName, preview: d.lastMessage || 'Chat shuru hui', _sortTime: d.lastMessageTime ? d.lastMessageTime.toMillis() : 0 });
        });
        liveChats.sort((a,b) => b._sortTime - a._sortTime);
        renderChatList();
      }, function(err){ showDebug('Chats load error: ' + err.message); });

      document.getElementById('sealMark').addEventListener('click', async function(){
        contactsListEl.innerHTML = '<div class="empty-state"><div class="es">Load ho raha hai...</div></div>';
        contactsScreen.classList.add('open');
        try{
          const snap = await db.collection('users').get();
          contactsListEl.innerHTML = '';
          let count = 0;
          snap.forEach(doc => {
            const d = doc.data();
            if(d.phone === me.phone) return;
            count++;
            const row = document.createElement('div');
            row.className = 'chat-row';
            row.innerHTML = `
              <div class="avatar">${iconForPhone(d.phone)}</div>
              <div class="chat-info">
                <div class="chat-top"><div class="chat-name">${d.name}</div></div>
                <div class="chat-bottom"><div class="chat-preview">+91 ${d.phone}</div></div>
              </div>`;
            row.addEventListener('click', () => startChatWith(d.phone, d.name));
            contactsListEl.appendChild(row);
          });
          if(count === 0){
            contactsListEl.innerHTML = '<div class="empty-state"><div class="et">Koi aur registered nahi hai</div><div class="es">Jab koi doosra insaan Quill par Sign Up karega, wo yahan dikhega.</div></div>';
          }
        } catch(err){ showDebug('Contacts load error: ' + err.message); }
      });

      document.getElementById('contactsBackBtn').addEventListener('click', () => contactsScreen.classList.remove('open'));

      async function startChatWith(otherPhone, otherName){
        const id = chatIdFor(me.phone, otherPhone);
        const ref = db.collection('chats').doc(id);
        const snap = await ref.get();
        if(!snap.exists){
          await ref.set({
            participants: [me.phone, otherPhone],
            participantNames: { [me.phone]: me.name, [otherPhone]: otherName },
            lastMessage: '', lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        contactsScreen.classList.remove('open');
        openRealChat(id, otherName);
      }

      function openRealChat(chatId, otherName){
        activeChatId = chatId;
        const av = document.getElementById('chatAvatar');
        const otherPhone = chatId.split('_').find(p => p !== me.phone) || '';
        av.classList.remove('dark'); av.innerHTML = iconForPhone(otherPhone);
        document.getElementById('chatName').textContent = otherName;
        document.getElementById('chatStatus').textContent = '';
        if(activeMsgUnsub) activeMsgUnsub();
        messagesEl.innerHTML = featherDecoHTML;
        activeMsgUnsub = db.collection('chats').doc(chatId).collection('messages').orderBy('createdAt', 'asc')
          .onSnapshot(function(snap){
            messagesEl.innerHTML = featherDecoHTML;
            snap.forEach(doc => {
              const m = doc.data();
              const isOut = m.senderPhone === me.phone;
              const row = document.createElement('div');
              row.className = 'bubble-row ' + (isOut ? 'out' : '');
              const t = m.createdAt ? m.createdAt.toDate().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) : '';
              row.innerHTML = `<div class="bubble ${isOut ? 'out' : 'in'}">${m.text}<span class="bubble-time">${t}${isOut ? ' ✓✓' : ''}</span></div>`;
              messagesEl.appendChild(row);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }, function(err){ showDebug('Messages load error: ' + err.message); });
        chatScreen.dataset.mode = 'real';
        chatScreen.classList.add('open');
      }

      function openSelfChat(){
        activeChatId = null;
        if(activeMsgUnsub){ activeMsgUnsub(); activeMsgUnsub = null; }
        const av = document.getElementById('chatAvatar');
        av.classList.add('dark'); av.innerHTML = iconSet.feather;
        document.getElementById('chatName').textContent = me.name + ' (You)';
        document.getElementById('chatStatus').textContent = 'Message yourself';
        messagesEl.innerHTML = featherDecoHTML;
        selfNotes.forEach(m => {
          const row = document.createElement('div');
          row.className = 'bubble-row out';
          row.innerHTML = `<div class="bubble out">${m.text}<span class="bubble-time">${m.time} ✓✓</span></div>`;
          messagesEl.appendChild(row);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
        chatScreen.dataset.mode = 'self';
        chatScreen.classList.add('open');
      }

      document.getElementById('backBtn').addEventListener('click', () => {
        chatScreen.classList.remove('open');
        if(activeMsgUnsub){ activeMsgUnsub(); activeMsgUnsub = null; }
      });

      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      document.getElementById('msgInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });

      async function sendMessage(){
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text) return;
        input.value = '';

        if(chatScreen.dataset.mode === 'self'){
          const timeStr = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
          selfNotes.push({ text, time: timeStr });
          const row = document.createElement('div');
          row.className = 'bubble-row out';
          row.innerHTML = `<div class="bubble out">${text}<span class="bubble-time">${timeStr} ✓✓</span></div>`;
          messagesEl.appendChild(row);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          return;
        }
        if(!activeChatId) return;
        try{
          await db.collection('chats').doc(activeChatId).collection('messages').add({
            text, senderPhone: me.phone, senderName: me.name, createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          await db.collection('chats').doc(activeChatId).set({
            lastMessage: text, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch(err){ showDebug('Send error: ' + err.message); }
      }

      document.getElementById('statusTab').addEventListener('click', () => alert('Status screen ek alag file mein banega!'));
      document.getElementById('quillTab').addEventListener('click', () => alert('Quill screen ek alag file mein banega!'));

      renderChatList();
    }

  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quill — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper: #ECE4D3;
    --ink: #1C2A44;
    --ink-soft: #33456b;
    --line: #b8a888;
    --wax: #7a2e2e;
    --error: #8c2f2f;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(0,0,0,0.03), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.04), transparent 45%),
      var(--paper);
    font-family:'Cormorant Garamond', serif;
    color: var(--ink);
  }
  .stage{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{
    position:relative; width:100%; max-width:380px;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:40px 32px 32px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.05), 0 12px 30px rgba(28,42,68,0.12);
    overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:8px;
    border:1px solid rgba(28,42,68,0.15); border-radius:2px; pointer-events:none;
  }
  .brand{ text-align:center; margin-bottom:4px; }
  .brand h1{ font-family:'Dancing Script', cursive; font-size:2.6rem; margin:0; }
  .brand p{ margin:2px 0 0; font-size:0.95rem; letter-spacing:2px; color: var(--ink-soft); font-style:italic; }
  .feather{ display:block; margin:12px auto 18px; width:42px; height:42px; opacity:0.75; }

  .tabs{ display:flex; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .tab{
    flex:1; text-align:center; padding:8px 0 12px;
    font-family:'Playfair Display', serif; font-size:1.02rem;
    color: var(--ink-soft); cursor:pointer; position:relative;
    background:none; border:none; font-weight:500;
  }
  .tab.active{ color: var(--ink); }
  .tab.active::after{
    content:""; position:absolute; bottom:-1px; left:30%; right:30%;
    height:2px; background: var(--wax);
  }

  .step{ display:none; flex-direction:column; gap:15px; }
  .step.active{ display:flex; }

  .step-title{ font-family:'Playfair Display', serif; font-size:1.1rem; text-align:center; margin:0 0 2px; }
  .step-sub{ text-align:center; font-size:0.92rem; color:var(--ink-soft); margin:-8px 0 4px; }

  .field label{
    display:block; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase;
    color: var(--ink-soft); margin-bottom:5px; font-weight:600;
  }
  .field input{
    width:100%; padding:9px 4px; font-size:1.08rem; font-family:'Cormorant Garamond', serif;
    background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--ink);
    outline:none; transition:border-color 0.2s; letter-spacing:0.5px;
  }
  .field input:focus{ border-bottom:1.5px solid var(--ink); }
  .field input.invalid{ border-bottom:1.5px solid var(--error); }
  .err-msg{ font-size:0.78rem; color:var(--error); margin-top:3px; min-height:1em; font-style:italic; }

  .submit-btn{
    margin-top:4px; padding:12px; background:var(--ink); color:var(--paper);
    border:none; border-radius:2px; font-family:'Playfair Display', serif;
    font-size:1rem; letter-spacing:1px; cursor:pointer; transition:background 0.2s, transform 0.1s;
  }
  .submit-btn:hover{ background:#0f1830; }
  .submit-btn:active{ transform:scale(0.98); }
  .submit-btn:disabled{ opacity:0.55; cursor:default; }

  .profile-done{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .avatar-circle{
    width:74px; height:74px; border-radius:50%;
    background: var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-size:1.8rem;
    border:2px solid var(--wax);
  }
  .profile-done h2{ font-family:'Playfair Display', serif; margin:4px 0 0; }
  .profile-phone{ font-size:1rem; color:var(--ink-soft); }
  .id-tag{
    font-size:0.85rem; color:var(--ink-soft); letter-spacing:1px;
    border:1px dashed var(--line); border-radius:3px; padding:6px 14px; margin-top:6px;
  }
  .switch-line{ text-align:center; font-size:0.9rem; color:var(--ink-soft); }
  .switch-line a{ color: var(--wax); cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--wax); }

  .success-toast{
    position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-20px);
    background: var(--ink); color: var(--paper); padding:12px 22px; border-radius:3px;
    font-family:'Playfair Display', serif; font-size:0.9rem;
    opacity:0; transition:all 0.35s ease; pointer-events:none; z-index:10;
  }
  .success-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .debug-banner{
    display:none;
    position:fixed; top:0; left:0; right:0;
    background:#8c2f2f; color:#fff; font-family: monospace;
    font-size:0.75rem; padding:10px 14px; z-index:999;
    word-break:break-word; line-height:1.4;
  }
</style>
</head>
<body>

<div class="debug-banner" id="debugBanner"></div>

<div class="stage">
  <div class="card">
    <div class="brand">
      <h1>Quill</h1>
      <p>write. share. connect.</p>
    </div>
    <svg class="feather" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 52C28 40 40 28 52 10C48 30 40 42 12 52Z" stroke="#1C2A44" stroke-width="1.4" fill="none"/>
      <path d="M12 52C22 46 30 38 38 26" stroke="#1C2A44" stroke-width="1"/>
      <circle cx="12" cy="52" r="1.6" fill="#1C2A44"/>
    </svg>

    <div class="tabs">
      <button class="tab active" id="tabSignup">Sign Up</button>
      <button class="tab" id="tabLogin">Login</button>
    </div>

    <!-- SIGNUP -->
    <div class="step active" id="stepSignup">
      <div class="field">
        <label for="suName">Naam</label>
        <input type="text" id="suName" placeholder="e.g. Noor Alam">
        <div class="err-msg" id="suNameErr"></div>
      </div>
      <div class="field">
        <label for="suPhone">Phone Number</label>
        <input type="tel" id="suPhone" placeholder="e.g. 98765 43210" maxlength="10">
        <div class="err-msg" id="suPhoneErr"></div>
      </div>
      <div class="field">
        <label for="suPass">Password</label>
        <input type="password" id="suPass" placeholder="Kam se kam 6 characters">
        <div class="err-msg" id="suPassErr"></div>
      </div>
      <div class="field">
        <label for="suConfirm">Password Confirm Karein</label>
        <input type="password" id="suConfirm" placeholder="••••••••">
        <div class="err-msg" id="suConfirmErr"></div>
      </div>
      <button class="submit-btn" id="signupBtn">Quill join karein</button>
    </div>

    <!-- LOGIN -->
    <div class="step" id="stepLogin">
      <div class="step-title">Wapas Quill par aayein</div>
      <div class="field">
        <label for="liPhone">Phone Number</label>
        <input type="tel" id="liPhone" placeholder="e.g. 98765 43210" maxlength="10">
        <div class="err-msg" id="liPhoneErr"></div>
      </div>
      <div class="field">
        <label for="liPass">Password</label>
        <input type="password" id="liPass" placeholder="••••••••">
        <div class="err-msg" id="liPassErr"></div>
      </div>
      <button class="submit-btn" id="loginBtn">Login Karein</button>
    </div>

    <!-- DONE -->
    <div class="step" id="stepDone">
      <div class="profile-done">
        <div class="avatar-circle" id="avatarLetter"></div>
        <h2 id="doneName"></h2>
        <div class="profile-phone" id="donePhone"></div>
        <div class="id-tag" id="doneId"></div>
        <div class="step-sub">Aapka data surakshit hai ✒️</div>
        <div class="switch-line"><a id="logoutLink">Logout / Dusra account</a></div>
      </div>
    </div>

  </div>
</div>

<div class="success-toast" id="toast"></div>

<script>
  // ============================================================
  // DEBUG BANNER — koi bhi JS error yahan screen par dikh jayega
  // ============================================================
  function showDebug(msg){
    const b = document.getElementById('debugBanner');
    b.textContent = '⚠️ ' + msg;
    b.style.display = 'block';
  }
  window.addEventListener('error', function(e){
    showDebug('Error: ' + e.message);
  });
  window.addEventListener('unhandledrejection', function(e){
    showDebug('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  if(typeof firebase === 'undefined'){
    showDebug('Firebase SDK load nahi ho paya. Internet connection check karein ya WiFi try karein.');
  }
</script>

<script>
  // ============================================================
  // FIREBASE CONFIG — Quill project
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB2pqAfH1hPW8M5GXeZpjVkknm72G--fr8",
    authDomain: "quill-34ba9.firebaseapp.com",
    projectId: "quill-34ba9",
    storageBucket: "quill-34ba9.firebasestorage.app",
    messagingSenderId: "946011366725",
    appId: "1:946011366725:web:0b17d601de7d4dcfa08a2c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const tabSignup = document.getElementById('tabSignup');
  const tabLogin = document.getElementById('tabLogin');
  const stepSignup = document.getElementById('stepSignup');
  const stepLogin = document.getElementById('stepLogin');
  const stepDone = document.getElementById('stepDone');

  function goStep(el){
    [stepSignup, stepLogin, stepDone].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }
  function showSignupTab(){
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    goStep(stepSignup);
  }
  function showLoginTab(){
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    goStep(stepLogin);
  }
  tabSignup.addEventListener('click', showSignupTab);
  tabLogin.addEventListener('click', showLoginTab);

  function setError(input, errEl, msg){
    if(msg){ input.classList.add('invalid'); errEl.textContent = msg; return false; }
    input.classList.remove('invalid'); errEl.textContent = ''; return true;
  }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2400);
  }
  function generateFakeId(name){
    const clean = name.trim().split(/\s+/)[0].toLowerCase();
    const num = Math.floor(1000 + Math.random()*9000);
    return '@' + clean + num;
  }
  function showDoneScreen(name, phone, userId){
    document.getElementById('avatarLetter').textContent = name[0].toUpperCase();
    document.getElementById('doneName').textContent = name;
    document.getElementById('donePhone').textContent = '+91 ' + phone;
    document.getElementById('doneId').textContent = userId;
    goStep(stepDone);
  }

  // ============================================================
  // SIGN UP — Firestore mein "users" collection, phone number ID ke roop mein
  // ============================================================
  const signupBtn = document.getElementById('signupBtn');
  signupBtn.addEventListener('click', async function(){
    const nameInput = document.getElementById('suName');
    const phoneInput = document.getElementById('suPhone');
    const passInput = document.getElementById('suPass');
    const confirmInput = document.getElementById('suConfirm');

    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim().replace(/\s+/g, '');
    const pass = passInput.value;
    const confirm = confirmInput.value;

    let ok = true;
    ok = setError(nameInput, document.getElementById('suNameErr'), name.length < 2 ? 'Apna naam likhein' : '') && ok;
    ok = setError(phoneInput, document.getElementById('suPhoneErr'), !/^[6-9]\d{9}$/.test(phone) ? '10 anko ka sahi phone number likhein' : '') && ok;
    ok = setError(passInput, document.getElementById('suPassErr'), pass.length < 6 ? 'Password kam se kam 6 characters ka ho' : '') && ok;
    ok = setError(confirmInput, document.getElementById('suConfirmErr'), confirm !== pass ? 'Password match nahi kar raha' : '') && ok;
    if(!ok) return;

    signupBtn.disabled = true;
    signupBtn.textContent = 'Bana rahe hain...';

    try{
      const docRef = db.collection('users').doc(phone);
      const existing = await docRef.get();

      if(existing.exists){
        setError(phoneInput, document.getElementById('suPhoneErr'), 'Ye number pehle se register hai, Login karein');
        showLoginTab();
        return;
      }

      const userId = generateFakeId(name);
      await docRef.set({
        name: name,
        phone: phone,
        password: pass, // demo ke liye plain text; production mein hash karna zaroori hai
        userId: userId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      showDoneScreen(name, phone, userId);
      toast('Khush aamdeed Quill par, ' + name + '!');
      [nameInput, phoneInput, passInput, confirmInput].forEach(i => i.value = '');
      setTimeout(() => {
        window.location.href = 'chats.html?name=' + encodeURIComponent(name) + '&phone=' + encodeURIComponent(phone) + '&uid=' + encodeURIComponent(userId);
      }, 1200);
    } catch(err){
      console.error(err);
      setError(phoneInput, document.getElementById('suPhoneErr'), 'Kuch गड़बड़ hui, dobara koshish karein');
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = 'Quill join karein';
    }
  });

  // ============================================================
  // LOGIN — Firestore se phone number dhoond kar password match
  // ============================================================
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.addEventListener('click', async function(){
    const phoneInput = document.getElementById('liPhone');
    const passInput = document.getElementById('liPass');

    const phone = phoneInput.value.trim().replace(/\s+/g, '');
    const pass = passInput.value;

    let ok = true;
    ok = setError(phoneInput, document.getElementById('liPhoneErr'), !/^[6-9]\d{9}$/.test(phone) ? '10 anko ka sahi phone number likhein' : '') && ok;
    ok = setError(passInput, document.getElementById('liPassErr'), pass === '' ? 'Password daalein' : '') && ok;
    if(!ok) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Check kar rahe hain...';

    try{
      const docRef = db.collection('users').doc(phone);
      const snap = await docRef.get();

      if(!snap.exists){
        setError(phoneInput, document.getElementById('liPhoneErr'), 'Ye number register nahi hai, pehle Sign Up karein');
        return;
      }

      const data = snap.data();
      if(data.password !== pass){
        setError(passInput, document.getElementById('liPassErr'), 'Galat password');
        return;
      }

      showDoneScreen(data.name, data.phone, data.userId);
      toast('Wapas aane ka shukriya, ' + data.name + '!');
      phoneInput.value = ''; passInput.value = '';
      setTimeout(() => {
        window.location.href = 'chats.html?name=' + encodeURIComponent(data.name) + '&phone=' + encodeURIComponent(data.phone) + '&uid=' + encodeURIComponent(data.userId);
      }, 1200);
    } catch(err){
      console.error(err);
      setError(phoneInput, document.getElementById('liPhoneErr'), 'Kuch गड़बड़ hui, dobara koshish karein');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login Karein';
    }
  });

  document.getElementById('logoutLink').addEventListener('click', showSignupTab);
</script>

</body>
</html>

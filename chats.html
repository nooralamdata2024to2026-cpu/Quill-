<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quill — Chats</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper: #ECE4D3;
    --paper-soft: #F3ECDD;
    --ink: #1C2A44;
    --ink-soft: #33456b;
    --line: #b8a888;
    --wax: #7a2e2e;
    --bubble-in: #F6F0E2;
    --unread: #1C2A44;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#0d1420;
    font-family:'Kalam', cursive;
    color: var(--ink);
    overflow:hidden;
  }
  .app{
    max-width:460px; margin:0 auto;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    background: var(--paper);
    position:relative;
    border:9px solid #10182a;
    border-radius:22px;
    overflow:hidden;
  }
  .app::before{
    content:"";
    position:absolute; inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
    pointer-events:none; z-index:50; mix-blend-mode:multiply;
  }

  .screen{ position:absolute; inset:9px; display:flex; flex-direction:column; background:var(--paper); transition: transform 0.28s ease; }
  #listScreen{ z-index:1; }
  #chatScreen, #contactsScreen{ z-index:2; transform: translateX(100%); }
  #chatScreen.open, #contactsScreen.open{ transform: translateX(0); }

  .list-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 2px;
  }
  .brand-row{ display:flex; align-items:center; gap:6px; }
  .brand-row .brand{
    font-family:'Caveat', cursive; font-weight:700; font-size:2.1rem; color:var(--ink);
  }
  .brand-row svg.feather-logo{ width:24px; height:24px; color:var(--ink); transform:rotate(15deg); }
  .header-icons{ display:flex; gap:4px; }
  .icon-btn{
    background:none; border:none; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; opacity:0.85;
  }
  .icon-btn svg{ width:19px; height:19px; }
  .tagline{ padding:0 18px 6px; font-size:0.95rem; color:var(--ink-soft); font-style:italic; }
  .welcome-line{ padding:0 18px 6px; font-size:0.9rem; color:var(--wax); font-style:italic; }

  .tabs-row{
    display:flex; gap:0; padding:6px 14px 0;
    border-bottom:1px solid var(--line);
  }
  .tab-item{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Kalam', cursive; font-weight:700; font-size:0.96rem;
    color: var(--ink-soft); padding-bottom:10px; position:relative;
    cursor:pointer;
  }
  .tab-item svg{ width:16px; height:16px; }
  .tab-item.active{ color:var(--ink); }
  .tab-item.active::after{
    content:""; position:absolute; left:15%; right:15%; bottom:-1px; height:2px; background:var(--wax);
  }

  .chat-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; }
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:20px; text-align:center;
  }
  .empty-state svg{ width:56px; height:56px; color:var(--ink-soft); opacity:0.5; }
  .empty-state .et{ font-family:'Kalam', cursive; font-weight:700; font-size:1.15rem; color:var(--ink); }
  .empty-state .es{ font-size:0.95rem; color:var(--ink-soft); max-width:260px; }

  .seal-mark{
    position:absolute; bottom:14px; right:16px;
    width:56px; height:56px; border-radius:50%;
    background: var(--ink); border:3px solid var(--paper);
    box-shadow:0 0 0 1.5px var(--line), 0 4px 12px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:5;
  }
  .seal-mark svg{ width:24px; height:24px; color:var(--paper-soft); }

  .chat-row{
    display:flex; align-items:center; gap:13px;
    padding:12px 18px; border-bottom:1px solid rgba(184,168,136,0.3);
    cursor:pointer; background:var(--paper);
  }
  .chat-row:active{ background: var(--paper-soft); }
  .avatar{
    width:50px; height:50px; border-radius:50%;
    background: var(--paper-soft); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; border:1.3px solid var(--line);
    overflow:hidden; padding:11px; font-family:'Kalam',cursive; font-weight:700; font-size:1.2rem;
  }
  .avatar svg{ width:100%; height:100%; }
  .avatar.dark{ background: var(--ink); color: var(--paper-soft); border-color:var(--wax); }
  .chat-info{ flex:1; min-width:0; }
  .chat-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .chat-name{ font-family:'Kalam', cursive; font-weight:700; font-size:1.06rem; }
  .chat-time{ font-size:0.8rem; color:var(--ink-soft); flex-shrink:0; }
  .chat-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
  .chat-preview{
    font-size:0.95rem; color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px;
  }
  .unread-badge{
    background: var(--unread); color:var(--paper); font-size:0.7rem;
    min-width:19px; height:19px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px; font-family:'Kalam', cursive; font-weight:700;
  }

  .sub-header{
    display:flex; align-items:center; gap:10px;
    padding:14px; border-bottom:1px solid var(--line);
  }
  .sub-header-title{ font-family:'Kalam', cursive; font-weight:700; font-size:1.1rem; }

  .chat-header .avatar{ width:38px; height:38px; padding:8px; font-size:0.9rem; }
  .chat-header-info{ flex:1; }
  .chat-header-name{ font-family:'Kalam', cursive; font-weight:700; font-size:1.05rem; }
  .chat-header-status{ font-size:0.83rem; color:var(--ink-soft); }

  .messages{
    flex:1; overflow-y:auto; padding:16px 14px 10px;
    display:flex; flex-direction:column; gap:12px;
    position:relative;
    background:
      radial-gradient(circle at 15% 10%, rgba(0,0,0,0.02), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(0,0,0,0.03), transparent 45%),
      var(--paper);
  }
  .date-divider{
    text-align:center; font-size:0.8rem; color:var(--ink-soft);
    letter-spacing:1px; margin:4px 0 6px; font-style:italic;
  }
  .date-divider .dash{ opacity:0.5; margin:0 6px; }

  .bubble-row{ display:flex; }
  .bubble-row.out{ justify-content:flex-end; }
  .bubble{
    max-width:75%; padding:9px 13px; border-radius:2px;
    font-size:1.03rem; line-height:1.35; position:relative;
  }
  .bubble::before, .bubble::after{
    content:"✕"; position:absolute; font-size:0.5rem; opacity:0.5; font-family: sans-serif;
  }
  .bubble.in::before, .bubble.in::after{ color: var(--ink-soft); }
  .bubble.out::before, .bubble.out::after{ color: var(--paper); opacity:0.4; }
  .bubble::before{ top:-5px; left:-5px; }
  .bubble::after{ bottom:-5px; right:-5px; }
  .bubble.in{ background: var(--bubble-in); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:0; }
  .bubble.out{ background: var(--ink); color: var(--paper); border-bottom-right-radius:0; }
  .bubble-time{ display:block; font-size:0.7rem; margin-top:4px; text-align:right; opacity:0.75; }

  .composer{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-top:1px solid var(--line);
    background: var(--paper);
  }
  .composer input{
    flex:1; padding:9px 14px; border-radius:20px;
    border:1px solid var(--line); background: var(--paper-soft);
    font-family:'Kalam', cursive; font-size:1rem; color: var(--ink); outline:none;
  }
  .send-btn{
    width:38px; height:38px; border-radius:50%;
    background: var(--ink); color:var(--paper); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .send-btn svg{ width:16px; height:16px; }

  .debug-banner{
    display:none; position:fixed; top:0; left:0; right:0;
    background:#8c2f2f; color:#fff; font-family: monospace;
    font-size:0.75rem; padding:10px 14px; z-index:999; word-break:break-word; line-height:1.4;
  }
</style>
</head>
<body>

<div class="debug-banner" id="debugBanner"></div>

<div class="app">

  <!-- ============ CHAT LIST SCREEN ============ -->
  <div class="screen" id="listScreen">
    <div class="list-header">
      <div class="brand-row">
        <div class="brand">Quill</div>
        <svg class="feather-logo" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M34 8C24 14 14 24 10 38c10-4 22-12 28-22 2-3 2-6-1-8-2-1-2-1-3 0Z"/><path d="M10 38c6-4 12-10 17-17"/></svg>
      </div>
      <div class="header-icons">
        <button class="icon-btn" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </div>
    <div class="tagline">write. share. connect.</div>
    <div class="welcome-line" id="welcomeLine" style="display:none;"></div>

    <div class="tabs-row">
      <div class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.4 8.5 8.5 0 0 1-4.1-1L3 20l1.1-5.4A8.4 8.4 0 1 1 21 11.5Z"/></svg>
        Chats
      </div>
      <div class="tab-item" id="statusTab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 .5 17 .5s2.5 6.5-2 12c-1.5 1.5-2.5 3.5-2.5 6"/></svg>
        Status
      </div>
      <div class="tab-item" id="quillTab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9v6H6z"/><path d="M10.5 8v12l-2 2-2-2V8"/></svg>
        Quill
      </div>
    </div>

    <div class="chat-list" id="chatList"></div>
    <div class="seal-mark" id="sealMark" title="Naya chat shuru karein">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>

  <!-- ============ CONTACTS SCREEN (Naya Chat) ============ -->
  <div class="screen" id="contactsScreen">
    <div class="sub-header">
      <button class="icon-btn" id="contactsBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="sub-header-title">Registered Phone Numbers</div>
    </div>
    <div class="chat-list" id="contactsList"></div>
  </div>

  <!-- ============ CHAT CONVERSATION SCREEN ============ -->
  <div class="screen" id="chatScreen">
    <div class="chat-header sub-header">
      <button class="icon-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="avatar" id="chatAvatar"></div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatName"></div>
        <div class="chat-header-status" id="chatStatus"></div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
  function showDebug(msg){
    const b = document.getElementById('debugBanner');
    if(!b) return;
    b.textContent = '⚠️ ' + msg;
    b.style.display = 'block';
  }
  window.addEventListener('error', function(e){ showDebug('Error: ' + e.message + ' (line ' + e.lineno + ')'); });

  // ============================================================
  // FIREBASE
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyB2pqAfH1hPW8M5GXeZpjVkknm72G--fr8",
    authDomain: "quill-34ba9.firebaseapp.com",
    projectId: "quill-34ba9",
    storageBucket: "quill-34ba9.firebasestorage.app",
    messagingSenderId: "946011366725",
    appId: "1:946011366725:web:0b17d601de7d4dcfa08a2c"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener('DOMContentLoaded', function(){

    const urlParams = new URLSearchParams(window.location.search);
    const me = {
      name: urlParams.get('name') || '',
      phone: urlParams.get('phone') || '',
      userId: urlParams.get('uid') || ''
    };

    if(me.name){
      const wl = document.getElementById('welcomeLine');
      wl.textContent = 'Logged in as ' + me.name + (me.userId ? ' (' + me.userId + ')' : '');
      wl.style.display = 'block';
    }

    const chatListEl = document.getElementById('chatList');
    const contactsListEl = document.getElementById('contactsList');
    const listScreen = document.getElementById('listScreen');
    const contactsScreen = document.getElementById('contactsScreen');
    const chatScreen = document.getElementById('chatScreen');
    const messagesEl = document.getElementById('messages');

    let liveChats = []; // Firestore se aaya realtime chat list
    let activeChatId = null;
    let activeMsgUnsub = null;

    function initialsOf(name){ return (name || '?').trim()[0].toUpperCase(); }

    function chatIdFor(phoneA, phoneB){
      return [phoneA, phoneB].sort().join('_');
    }

    // ---------------------------------------------------------
    // CHAT LIST render (self-note + real Firestore chats)
    // ---------------------------------------------------------
    function renderChatList(){
      chatListEl.innerHTML = '';

      if(!me.phone){
        chatListEl.innerHTML = `<div class="empty-state"><div class="et">Pehle login karein</div><div class="es">Chats dekhne ke liye pehle apne account se sign in karein.</div></div>`;
        return;
      }

      const items = [];

      // Khud ka note-to-self box
      items.push({
        id: 'self',
        name: me.name + ' (You)',
        dark: true,
        time: 'now',
        preview: 'Khud ko note likhein',
        isSelf: true
      });

      liveChats.forEach(c => items.push(c));

      if(items.length === 0){
        chatListEl.innerHTML = `<div class="empty-state"><div class="et">Koi chat nahi hai</div><div class="es">Neeche wale button se naya chat shuru karein.</div></div>`;
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'chat-row';
        row.innerHTML = `
          <div class="avatar ${item.dark ? 'dark' : ''}">${initialsOf(item.name)}</div>
          <div class="chat-info">
            <div class="chat-top">
              <div class="chat-name">${item.name}</div>
              <div class="chat-time">${item.time || ''}</div>
            </div>
            <div class="chat-bottom">
              <div class="chat-preview">${item.preview || ''}</div>
            </div>
          </div>
        `;
        row.addEventListener('click', () => {
          if(item.isSelf) openSelfChat();
          else openRealChat(item.id, item.name);
        });
        chatListEl.appendChild(row);
      });
    }

    // ---------------------------------------------------------
    // Realtime listener: mere saare chats (Firestore)
    // ---------------------------------------------------------
    if(me.phone){
      db.collection('chats')
        .where('participants', 'array-contains', me.phone)
        .onSnapshot(function(snap){
          liveChats = [];
          snap.forEach(doc => {
            const d = doc.data();
            const otherPhone = d.participants.find(p => p !== me.phone) || me.phone;
            const otherName = (d.participantNames && d.participantNames[otherPhone]) || otherPhone;
            liveChats.push({
              id: doc.id,
              name: otherName,
              time: d.lastMessageTime ? '' : '',
              preview: d.lastMessage || 'Chat shuru hui',
              _sortTime: d.lastMessageTime ? d.lastMessageTime.toMillis() : 0
            });
          });
          liveChats.sort((a,b) => b._sortTime - a._sortTime);
          renderChatList();
        }, function(err){
          showDebug('Chats load error: ' + err.message);
        });
    } else {
      renderChatList();
    }

    // ---------------------------------------------------------
    // SEAL BUTTON — contacts list kholo
    // ---------------------------------------------------------
    document.getElementById('sealMark').addEventListener('click', async function(){
      if(!me.phone){ alert('Pehle login karein'); return; }
      contactsListEl.innerHTML = '<div class="empty-state"><div class="es">Load ho raha hai...</div></div>';
      contactsScreen.classList.add('open');
      try{
        const snap = await db.collection('users').get();
        contactsListEl.innerHTML = '';
        let count = 0;
        snap.forEach(doc => {
          const d = doc.data();
          if(d.phone === me.phone) return;
          count++;
          const row = document.createElement('div');
          row.className = 'chat-row';
          row.innerHTML = `
            <div class="avatar">${initialsOf(d.name)}</div>
            <div class="chat-info">
              <div class="chat-top"><div class="chat-name">${d.name}</div></div>
              <div class="chat-bottom"><div class="chat-preview">+91 ${d.phone}</div></div>
            </div>
          `;
          row.addEventListener('click', () => startChatWith(d.phone, d.name));
          contactsListEl.appendChild(row);
        });
        if(count === 0){
          contactsListEl.innerHTML = '<div class="empty-state"><div class="et">Koi aur registered nahi hai</div><div class="es">Jab koi doosra insaan Quill par Sign Up karega, wo yahan dikhega.</div></div>';
        }
      } catch(err){
        showDebug('Contacts load error: ' + err.message);
      }
    });

    document.getElementById('contactsBackBtn').addEventListener('click', () => {
      contactsScreen.classList.remove('open');
    });

    // ---------------------------------------------------------
    // Naya chat shuru karo (ya purana khol do agar pehle se hai)
    // ---------------------------------------------------------
    async function startChatWith(otherPhone, otherName){
      const id = chatIdFor(me.phone, otherPhone);
      const ref = db.collection('chats').doc(id);
      const snap = await ref.get();
      if(!snap.exists){
        await ref.set({
          participants: [me.phone, otherPhone],
          participantNames: { [me.phone]: me.name, [otherPhone]: otherName },
          lastMessage: '',
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      contactsScreen.classList.remove('open');
      openRealChat(id, otherName);
    }

    // ---------------------------------------------------------
    // Asli (Firestore) chat kholna, real-time messages
    // ---------------------------------------------------------
    function openRealChat(chatId, otherName){
      activeChatId = chatId;
      document.getElementById('chatAvatar').classList.remove('dark');
      document.getElementById('chatAvatar').textContent = initialsOf(otherName);
      document.getElementById('chatName').textContent = otherName;
      document.getElementById('chatStatus').textContent = '';

      if(activeMsgUnsub) activeMsgUnsub();
      messagesEl.innerH
